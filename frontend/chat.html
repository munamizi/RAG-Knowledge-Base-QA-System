<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>RAG 知识库 · 知识问答</title>
  <script>if(window.top !== window.self) document.documentElement.classList.add('embedded-view');</script>
  <style>
    :root{
      --bg:#f3f5f7;
      --panel:#ffffff;
      --text:#1f2d3d;
      --muted:#7a869a;
      --brand:#1aa7ff;
      --brand2:#5b7cfa;
      --bubble-user:#1aa7ff;
      --bubble-bot:#ffffff;
      --border:#e6e9ef;
      --shadow:0 10px 30px rgba(31,45,61,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(26,167,255,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(91,124,250,.18), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:980px;
      height:min(820px, 92vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(90deg, rgba(26,167,255,.10), rgba(91,124,250,.10));
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
    }
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 18px rgba(26,167,255,.25);
    }
    .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .title strong{font-size:14px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
    }
    .btn{
      border:none;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .chat{
      flex:1;
      overflow:auto;
      padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(26,167,255,.05), transparent 40%),
                 linear-gradient(0deg, rgba(91,124,250,.05), transparent 45%);
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 14px;
    }
    .msg{
      display:flex;
      gap:10px;
      margin:10px 0;
      align-items:flex-end;
    }
    .msg.user{justify-content:flex-end}
    /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .avatar{
      width:34px;height:34px;border-radius:10px;
      background:#e9eef7;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;
      color:#3b4a5a;
      flex:0 0 auto;
    }
    .avatar.bot{background:linear-gradient(135deg, rgba(26,167,255,.18), rgba(91,124,250,.18))}
    .bubble{
      max-width:min(720px, 76%);
      display:inline-block;
      border-radius:14px;
      padding:10px 12px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap: break-word;
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-color:transparent;
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
    }
    .msg.user .meta{color:rgba(255,255,255,.85)}
    details.progress{
      margin-top:8px;
      border:1px dashed rgba(122,134,154,.45);
      border-radius:12px;
      padding:8px 10px;
      background:rgba(122,134,154,.06);
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:var(--muted);
      font-size:12px;
    }
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;color:#56657a}

    .answer-images{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .answer-images img{
      display: block;
      max-width: min(100%, 600px);
      max-height: 600px;
      width: auto;
      height: auto;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(31,45,61,.10);
      background:#fff;
    }
    .answer-images a{
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
      word-break:break-all;
    }

    .typing{
      display:inline-flex;gap:6px;align-items:center;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:#9aa6b2;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-5px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:12px 14px;
      display:flex;
      gap:10px;
      align-items:flex-end;
      background:#fff;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;
      max-height:140px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
    }
    textarea:focus{border-color:rgba(26,167,255,.6); box-shadow:0 0 0 3px rgba(26,167,255,.12)}
    .send{
      width:88px;
      height:44px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      padding:0 14px 12px;
      color:var(--muted);
      font-size:12px;
      background:#fff;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#f7f9fc;
      color:#3b4a5a;
    }
  </style>
  <style>
    /* Claude-inspired：暖色、中性、内容优先 */
    :root{
      color-scheme:light;
      --bg:#f6f4f0;--panel:#fffdfa;--text:#2d2a26;--muted:#7a756f;
      --brand:#d97757;--brand2:#d97757;--bubble-user:#eeeae4;
      --bubble-bot:transparent;--border:#e5dfd7;--soft:#f3f0eb;
      --shadow:0 16px 44px rgba(59,49,39,.08);
    }
    *{scrollbar-width:thin;scrollbar-color:#cfc7bd transparent}
    *::-webkit-scrollbar{width:8px;height:8px}
    *::-webkit-scrollbar-thumb{background:#d6cfc6;border:2px solid transparent;border-radius:8px;background-clip:padding-box}
    body{
      min-height:100dvh;height:auto;padding:24px;overflow:hidden;
      color:var(--text);background:var(--bg);
      font-family:"MiSans","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .app{
      width:100%;max-width:1040px;height:min(880px,calc(100dvh - 48px));
      border:1px solid var(--border);border-radius:20px;background:var(--panel);
      box-shadow:var(--shadow);overflow:hidden;
    }
    .topbar{
      min-height:70px;padding:14px 18px;border-bottom:1px solid var(--border);
      background:rgba(255,253,250,.96);
    }
    .brand{gap:11px;min-width:220px}
    .logo{
      position:relative;width:38px;height:38px;flex:0 0 38px;border-radius:12px;
      background:#d97757;box-shadow:none;font-size:0;
    }
    .logo::before{
      content:"R";position:absolute;inset:0;display:grid;place-items:center;
      color:#fffaf5;font-family:"STSong","Songti SC",serif;font-size:17px;font-weight:700;
    }
    .title strong{color:#332f2b;font-size:15px;font-weight:650;letter-spacing:.01em}
    .title span{margin-top:4px;color:#8a847d;font-size:11px}
    .top-actions{gap:8px}
    .top-actions label{
      min-height:30px;margin-right:2px!important;padding:5px 7px;
      color:#77716a!important;font-size:11px!important;
    }
    #streamToggle{accent-color:#d97757}
    .pill{
      min-height:30px;padding:6px 10px;color:#716b64;border:0;border-radius:9px;
      background:#f2eee8;font-size:11px;
    }
    .pill::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#67916f}
    .btn{
      min-height:32px;padding:6px 10px;color:#68625c;border:0;border-radius:9px;
      background:transparent;font-size:11px;transition:background-color .15s ease,color .15s ease;
    }
    .btn:hover{color:#332f2b;background:#f2eee8}
    .chat{
      flex:1;padding:30px clamp(20px,6vw,72px) 22px;overflow:auto;
      background:#fbfaf8;
    }
    .dayline{margin:0 0 26px;color:#9b958e;font-size:11px}
    .msg{margin:19px 0;gap:11px;align-items:flex-start}
    .msg.user{justify-content:flex-end}
    .msg>div:not(.avatar){min-width:0;flex:1}
    .msg.user>div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end}
    .avatar{
      width:30px;height:30px;flex:0 0 30px;border:1px solid #ddd6cd;border-radius:10px;
      color:#6f6962;background:#f2eee8;box-shadow:none;font-size:11px;
    }
    .avatar.bot{
      color:#fff9f3;border-color:#b95b40;border-radius:11px;
      background:linear-gradient(145deg,#cf7455 0%,#b95a40 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 5px 14px rgba(82,49,38,.12);
      font-family:"STSong","Songti SC",serif;font-size:0;
    }
    .avatar.bot::before{content:none}
    .assistant-glyph{
      display:block;width:21px;height:21px;overflow:visible;
      fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;
    }
    .msg.user .avatar{display:none}
    .bubble{
      max-width:min(760px,86%);padding:1px 0;color:#37332f;border:0;border-radius:0;
      background:transparent;box-shadow:none;font-size:14px;line-height:1.76;
    }
    .msg.user .bubble{
      max-width:min(650px,76%);padding:10px 14px;color:#3b3733;border:0;
      border-radius:16px 16px 5px 16px;background:#eeeae4;box-shadow:none;
    }
    .meta,.msg.user .meta{margin-top:6px;color:#9b958e;font-size:10px}
    details.progress{
      margin-top:13px;padding:9px 11px;border:1px solid #e4ddd5;border-radius:11px;
      background:#f5f1ec;
    }
    details.progress summary{color:#746d66;font-size:11px}
    .progress li{margin:5px 0;color:#6f6962;font-size:11px}
    .answer-images img{border:1px solid #e2dbd2;border-radius:12px;box-shadow:none}
    .answer-images a{color:#a15e49;font-size:10px;text-decoration:underline;text-underline-offset:3px}
    .typing{gap:5px}.dot{width:5px;height:5px;background:#c57b62}
    .composer{
      margin:12px 18px 0;padding:7px 7px 7px 14px;gap:8px;
      border:1px solid #dcd5cc;border-radius:18px;background:#fff;
      box-shadow:0 7px 24px rgba(61,50,40,.07);
    }
    textarea{
      min-height:44px;padding:10px 2px;color:#342f2b;border:0;border-radius:0;
      background:transparent;font-size:14px;box-shadow:none;
    }
    textarea::placeholder{color:#9d968e}
    textarea:focus{border:0;box-shadow:none}
    .send{
      width:76px;height:42px;color:#fffaf5;border:0;border-radius:12px;
      background:#d97757;box-shadow:none;font-size:13px;font-weight:650;
      transition:background-color .15s ease,transform .15s ease;
    }
    .send:hover:not(:disabled){background:#c96749;transform:translateY(-1px)}
    .hint{padding:8px 24px 13px;color:#969088;background:var(--panel);font-size:10px}
    .kbd{padding:1px 5px;color:#706a63;border:1px solid #ded7cf;border-radius:5px;background:#f3f0eb}
    button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid rgba(217,119,87,.55);outline-offset:2px}
    @media(max-width:720px){
      body{padding:0}.app{height:100dvh;border:0;border-radius:0;box-shadow:none}
      .topbar{min-height:auto;padding:12px 13px;flex-wrap:wrap}.brand{min-width:0;flex:1 1 180px}
      .title span{display:none}.top-actions{flex:1 1 100%;justify-content:flex-end}
      .chat{padding:22px 16px 17px}.msg{gap:9px}.bubble{max-width:91%}.msg.user .bubble{max-width:86%}
      .composer{margin:8px 10px 0;padding-left:12px}.send{width:68px;flex-basis:68px}.hint{display:none}
    }
    @media(max-width:430px){.pill{display:none}.top-actions label{margin-left:auto}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <style>
    /* 2026 UI refresh：知识索引工作台 */
    :root{
      --canvas:#eceae4;
      --paper:#f8f7f3;
      --paper-strong:#ffffff;
      --ink:#242925;
      --muted:#777b75;
      --line:#deddd6;
      --rail:#202723;
      --rail-muted:#aeb7b0;
      --accent:#c86446;
      --accent-soft:#f3e1da;
      --success:#5f8568;
      --shadow:0 24px 70px rgba(37,42,38,.14);
    }
    html,body{height:100%}
    body{
      position:relative;height:100dvh;min-height:0;padding:clamp(14px,2.2vh,26px) clamp(28px,4.5vw,72px);overflow:hidden;
      box-sizing:border-box;display:flex;justify-content:center;align-items:center;
      background:
        linear-gradient(rgba(39,47,42,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(39,47,42,.035) 1px,transparent 1px),
        var(--canvas);
      background-size:32px 32px;
      color:var(--ink);
      font-family:"MiSans","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:linear-gradient(115deg,rgba(255,255,255,.42),transparent 34% 67%,rgba(200,100,70,.035));
    }
    .app{
      position:relative;display:flex;flex-direction:column;
      width:min(1260px,100%);max-width:1260px;margin:0 auto;height:100%;max-height:100%;
      border:1px solid rgba(31,39,35,.12);border-radius:18px;overflow:hidden;
      background:var(--paper);box-shadow:var(--shadow);
    }
    .workspace{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column;background:var(--paper)}
    .site-header{display:flex;align-items:center;min-height:60px;padding:10px clamp(24px,3.2vw,42px);border-bottom:1px solid var(--line);background:rgba(248,247,243,.94);backdrop-filter:blur(12px)}
    .site-brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
    .site-mark{width:32px;height:32px;display:grid;place-items:center;flex:0 0 32px;color:var(--accent)}
    .site-mark svg{width:32px;height:32px;overflow:visible}
    .site-mark path{fill:none;stroke:#868b85;stroke-width:1.35;stroke-linecap:round}
    .site-mark circle{fill:var(--paper);stroke:var(--accent);stroke-width:1.35}
    .site-mark circle:nth-of-type(2){fill:var(--accent)}
    .site-brand strong{display:block;font-size:14px;font-weight:650;letter-spacing:.04em}.site-brand small{display:block;margin-top:3px;color:var(--muted);font:9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
    .site-nav{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#efeee8}
    .site-nav a{display:flex;align-items:center;gap:7px;min-height:33px;padding:6px 12px;border-radius:8px;color:#737872;text-decoration:none;font-size:11px;transition:background-color .16s ease,color .16s ease}
    .site-nav a:hover{color:var(--ink)}.site-nav a.active{color:var(--ink);background:#fff;box-shadow:0 2px 7px rgba(36,41,37,.08)}
    .site-nav svg{width:15px;height:15px;stroke:currentColor}
    .index-rail{
      position:relative;display:flex;flex-direction:column;min-height:0;padding:22px 16px 18px;
      color:#f4f1eb;background:var(--rail);overflow:hidden;
    }
    .index-rail::after{
      content:"";position:absolute;left:38px;top:102px;bottom:30px;width:1px;
      background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.025));pointer-events:none;
    }
    .rail-brand{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:0 6px 24px}
    .rail-mark{
      width:42px;height:42px;display:grid;place-items:center;flex:0 0 42px;
      border:1px solid rgba(255,255,255,.13);border-radius:13px;color:#fff8f2;
      background:var(--accent);font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700;
      box-shadow:0 9px 24px rgba(0,0,0,.18);
    }
    .rail-brand strong{display:block;font-size:14px;font-weight:650;letter-spacing:.04em}
    .rail-brand span{display:block;margin-top:4px;color:var(--rail-muted);font:9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em;text-transform:uppercase}
    .rail-label{position:relative;z-index:1;margin:12px 10px 8px;color:#7f8a82;font:9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
    .rail-nav{position:relative;z-index:1;display:grid;gap:6px}
    .rail-link{
      display:flex;align-items:center;gap:11px;min-height:42px;padding:9px 11px;
      color:var(--rail-muted);border:1px solid transparent;border-radius:11px;text-decoration:none;
      font-size:12px;transition:color .16s ease,background-color .16s ease,border-color .16s ease;
    }
    .rail-link svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor}
    .rail-link:hover{color:#fff;background:rgba(255,255,255,.055)}
    .rail-link.active{color:#fff5ef;border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.085)}
    .rail-link.active::before{content:"";width:3px;height:16px;margin-left:-12px;border-radius:0 4px 4px 0;background:var(--accent)}
    .rail-note{position:relative;z-index:1;margin-top:auto;padding:14px 11px 2px 22px;color:#8f9a92;font-size:10px;line-height:1.65}
    .rail-note::before{content:"";position:absolute;left:4px;top:19px;width:6px;height:6px;border-radius:50%;background:#739a7c;box-shadow:0 0 0 4px rgba(115,154,124,.1)}
    .topbar{
      min-height:58px;padding:10px clamp(24px,3.2vw,42px);gap:14px;border-bottom:1px solid var(--line);
      background:#f3f2ed;
    }
    .brand{min-width:0;gap:0}.brand>.logo{display:none}
    .title{gap:1px}.title strong{font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700;letter-spacing:.015em;color:var(--ink)}
    .title span{margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.02em}
    .top-actions{gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .stream-switch{min-height:34px!important;margin:0!important;padding:5px 10px!important;gap:7px!important;border:1px solid var(--line);border-radius:9px;background:#fff;color:#666b66!important;font-size:12px!important}
    .stream-switch input{width:14px;height:14px;margin:0;accent-color:var(--accent)}
    .pill{position:relative;min-height:34px;padding:7px 12px 7px 24px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#70756f;font-size:11px}
    .pill::before{position:absolute;left:10px;top:50%;width:6px;height:6px;margin:0;transform:translateY(-50%);background:#9b9e9a}
    .pill[data-state="online"]::before{background:var(--success);box-shadow:0 0 0 3px rgba(95,133,104,.12)}
    .btn{min-height:34px;padding:7px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:#6e726d;font-size:11px}
    .btn:hover{color:var(--ink);border-color:var(--line);background:#fff}
    .chat{
      position:relative;flex:1;min-height:0;padding:32px clamp(28px,5vw,72px) 44px;

  <script>
    // 后端页面使用同源接口；file:// 或 IDE 预览时固定访问 FastAPI 的 8000 端口
    const API_BASE = location.port === '8000' ? location.origin : 'http://127.0.0.1:8000';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');

    const stickyQuestionBar = document.getElementById('stickyQuestionBar');
    const stickyQuestionInner = document.getElementById('stickyQuestionInner');
    const stickyQuestionText = document.getElementById('stickyQuestionText');
    let activeStickyUserMsg = null;
    let stickyRafId = 0;

    function scheduleStickyQuestionUpdate(){
      if(stickyRafId) return;
      stickyRafId = requestAnimationFrame(() => {
        stickyRafId = 0;
        updateStickyQuestion();
      });
    }

    function updateStickyQuestion(){
      if(!chatEl || !stickyQuestionBar || !stickyQuestionText) return;

      const chatRect = chatEl.getBoundingClientRect();
      const userMsgs = Array.from(chatEl.querySelectorAll('.msg.user'));
      if(userMsgs.length === 0){
        hideStickyQuestion();
        return;
      }

      // 若视口顶部已能直接看到某条用户提问，则无需悬浮条重复提醒
      let isAnyQuestionInUpperView = false;
      for(const userMsg of userMsgs){
        const r = userMsg.getBoundingClientRect();
        if(r.top < chatRect.top + 130 && r.bottom > chatRect.top + 10){
          isAnyQuestionInUpperView = true;
          break;
        }
      }
      if(isAnyQuestionInUpperView){
        hideStickyQuestion();
        return;
      }

      // 寻找当前正在阅读的模型回答所对应的用户提问（已被卷出顶部，且其回答仍在视口中）
      let targetUserMsg = null;

      for(let i = 0; i < userMsgs.length; i++){
        const userMsg = userMsgs[i];
        const userRect = userMsg.getBoundingClientRect();

        let nextEl = userMsg.nextElementSibling;
        let turnEndBottom = userRect.bottom;

        while(nextEl && !nextEl.classList.contains('user')){
          if(nextEl.classList.contains('bot')){
            const botRect = nextEl.getBoundingClientRect();
            turnEndBottom = Math.max(turnEndBottom, botRect.bottom);
          }
          nextEl = nextEl.nextElementSibling;
        }

        const questionScrolledPast = userRect.bottom <= chatRect.top + 16;
        const replyStillInView = turnEndBottom > chatRect.top + 40;

        if(questionScrolledPast && replyStillInView){
          targetUserMsg = userMsg;
        }
      }

      if(targetUserMsg){
        showStickyQuestion(targetUserMsg);
      } else {
        hideStickyQuestion();
      }
    }

    function showStickyQuestion(userMsg){
      activeStickyUserMsg = userMsg;
      const bubble = userMsg.querySelector('.bubble');
      const text = bubble ? bubble.textContent.trim() : '';
      if(!text){
        hideStickyQuestion();
        return;
      }
      if(stickyQuestionText.textContent !== text){
        stickyQuestionText.textContent = text;
      }
      if(stickyQuestionInner){
        stickyQuestionInner.title = `点击回到提问位置：\n${text}`;
      }
      stickyQuestionBar.inert = false;
      stickyQuestionBar.classList.add('is-visible');
      stickyQuestionBar.setAttribute('aria-hidden', 'false');
    }

    function hideStickyQuestion(){
      activeStickyUserMsg = null;
      if(stickyQuestionBar){
        stickyQuestionBar.classList.remove('is-visible');
        stickyQuestionBar.setAttribute('aria-hidden', 'true');
        stickyQuestionBar.inert = true;
      }
    }

    if(stickyQuestionInner){
      stickyQuestionInner.addEventListener('click', () => {
        const targetUserMsg = activeStickyUserMsg;
        if(!targetUserMsg) return;
        const targetTop = targetUserMsg.offsetTop - 20;
        chatEl.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });

        const bubble = targetUserMsg.querySelector('.bubble');

          targetUserMsg.classList.remove('is-emphasized');
          void targetUserMsg.offsetWidth;
          targetUserMsg.classList.add('is-emphasized');
          setTimeout(() => targetUserMsg.classList.remove('is-emphasized'), 1600);
        }
      });
    }

    // Session ID Logic

    let followStreamOutput = true;

    function isNearChatBottom(threshold = 72){
      return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight <= threshold;

    function scrollToBottom(force = true){
      if(!force && !followStreamOutput) return;

    function formatTime(ts){
      if(!ts) return nowTime();

      if(Number.isNaN(d.getTime())) return nowTime();

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];

      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [

        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function cleanCitationSection(str){
      if(!str) return '';
      return String(str)
        .replace(/^#{1,6}\s*/, '')
        .replace(/^[-*+]\s*/, '')
        .trim();
    }

    function escapeHtmlText(str){
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderCitationMarkdown(rawContent){
      if(!rawContent) return '<p class="cit-p">（暂无片段内容）</p>';
      const raw = String(rawContent).trim();
      if(!raw) return '<p class="cit-p">（暂无片段内容）</p>';

      const lines = raw.split(/\r?\n/);
      const htmlParts = [];
      let inCodeBlock = false;
      let codeBuffer = [];
      let inList = false;
      let listType = 'ul';

      function flushList(){
        if(inList){
          htmlParts.push(`</${listType}>`);
          inList = false;
        }
      }

      function formatInline(text){
        const safe = escapeHtmlText(text);
        return safe
          .replace(/`([^`]+)`/g, '<code class="cit-inline-code">$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="cit-link">$1</a>');
      }

      for(let i = 0; i < lines.length; i++){
        const line = lines[i];

        // 代码块标记 ```
        const fenceMatch = line.match(/^```(.*)$/);
        if(fenceMatch){
          flushList();
          if(inCodeBlock){
            htmlParts.push(`<pre class="cit-pre"><code>${escapeHtmlText(codeBuffer.join('\n'))}</code></pre>`);
            codeBuffer = [];
            inCodeBlock = false;
          }else{
            inCodeBlock = true;
          }
          continue;
        }

        if(inCodeBlock){
          codeBuffer.push(line);
          continue;
        }

        // 空行
        if(!line.trim()){
          flushList();
          continue;
        }

        // 标题 (# ~ ######)
        const hMatch = line.match(/^(#{1,6})\s+(.*)$/);
        if(hMatch){
          flushList();
          const level = hMatch[1].length;
          const hText = formatInline(hMatch[2].trim());
          const tag = level <= 2 ? 'h3' : 'h4';
          htmlParts.push(`<${tag} class="cit-heading cit-h${level}">${hText}</${tag}>`);
          continue;
        }

        // 引用块 (> ...)
        const bqMatch = line.match(/^>\s*(.*)$/);
        if(bqMatch){
          flushList();
          htmlParts.push(`<blockquote class="cit-blockquote">${formatInline(bqMatch[1])}</blockquote>`);
          continue;
        }

        // 无序列表 (- / * / + ...)
        const ulMatch = line.match(/^[-*+]\s+(.*)$/);
        if(ulMatch){
          if(!inList || listType !== 'ul'){
            flushList();
            htmlParts.push('<ul class="cit-list">');
            inList = true;
            listType = 'ul';
          }
          htmlParts.push(`<li>${formatInline(ulMatch[1])}</li>`);
          continue;
        }

        // 有序列表 (1. ...)
        const olMatch = line.match(/^(\d+)\.\s+(.*)$/);
        if(olMatch){
          if(!inList || listType !== 'ol'){
            flushList();
            htmlParts.push('<ol class="cit-list">');
            inList = true;
            listType = 'ol';
          }
          htmlParts.push(`<li>${formatInline(olMatch[2])}</li>`);
          continue;
        }

        // 普通段落
        flushList();
        htmlParts.push(`<p class="cit-p">${formatInline(line)}</p>`);
      }

      flushList();
      if(inCodeBlock && codeBuffer.length > 0){
        htmlParts.push(`<pre class="cit-pre"><code>${escapeHtmlText(codeBuffer.join('\n'))}</code></pre>`);
      }

      return htmlParts.join('') || '<p class="cit-p">（暂无片段内容）</p>';
    }

                <span>打开</span>

              </button>
            </div>
          </div>
          <div class="citation-popover-body">
            <div class="citation-popover-meta" id="cit-pop-meta" hidden>
              <span class="citation-popover-section" id="cit-pop-section"></span>
              <span class="citation-popover-tag" id="cit-pop-item" hidden></span>

            <div class="citation-popover-text" id="cit-pop-text"></div>
          </div>
        </div>
      `;

      document.body.appendChild(popover);
      citationPopover = popover;

      const closeBtn = popover.querySelector('#cit-pop-close');
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeCitationPopover();
      });

      const copyBtn = popover.querySelector('#cit-pop-copy');
      const copyLabel = copyBtn.querySelector('.cit-pop-copy-label');
      copyBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const text = popover.dataset.rawContent || popover.querySelector('#cit-pop-text').textContent || '';
        if(!text) return;
        try{
          await navigator.clipboard.writeText(text);
          copyLabel.textContent = '已复制 ✓';
          copyBtn.classList.add('is-copied');
          setTimeout(() => {
            copyLabel.textContent = '复制';
            copyBtn.classList.remove('is-copied');
          }, 1500);
        }catch(_){
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try{
            document.execCommand('copy');
            copyLabel.textContent = '已复制 ✓';
            copyBtn.classList.add('is-copied');
            setTimeout(() => {
              copyLabel.textContent = '复制';
              copyBtn.classList.remove('is-copied');
            }, 1500);
          }catch(err){}
          ta.remove();
        }
      });

      popover.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      document.addEventListener('click', (e) => {
        if(citationPopover && citationPopover.classList.contains('is-open')){
          if(!citationPopover.contains(e.target) && (!activeCitationTrigger || !activeCitationTrigger.contains(e.target))){
            closeCitationPopover();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape' && citationPopover && citationPopover.classList.contains('is-open')){
          closeCitationPopover();
        }
      });

      chatEl.addEventListener('scroll', () => {
        if(citationPopover && citationPopover.classList.contains('is-open')){
          closeCitationPopover();
        }
      }, { passive: true });

      window.addEventListener('resize', () => {
        if(citationPopover && citationPopover.classList.contains('is-open') && activeCitationTrigger){
          positionCitationPopover(citationPopover, activeCitationTrigger);
        }
      }, { passive: true });

      return citationPopover;
    }

    function positionCitationPopover(popover, triggerEl){
      const triggerRect = triggerEl.getBoundingClientRect();
      const popoverRect = popover.getBoundingClientRect();
      const margin = 8;
      const viewportPadding = 12;

      const popoverHeight = popoverRect.height || 220;
      const popoverWidth = popoverRect.width || 360;

      const spaceBelow = window.innerHeight - triggerRect.bottom - margin;
      const spaceAbove = triggerRect.top - margin;

      let placement = 'bottom';
      let top = 0;

      if(spaceBelow < popoverHeight && spaceAbove > spaceBelow){
        placement = 'top';
        top = triggerRect.top - popoverHeight - margin;
      }else{
        placement = 'bottom';
        top = triggerRect.bottom + margin;
      }

      let left = triggerRect.left;
      if(left + popoverWidth > window.innerWidth - viewportPadding){
        left = window.innerWidth - popoverWidth - viewportPadding;
      }
      if(left < viewportPadding){
        left = viewportPadding;
      }

      if(top < viewportPadding) top = viewportPadding;
      if(top + popoverHeight > window.innerHeight - viewportPadding){
        top = window.innerHeight - popoverHeight - viewportPadding;
      }

      popover.style.top = `${Math.round(top)}px`;
      popover.style.left = `${Math.round(left)}px`;
      popover.dataset.placement = placement;

      // 动态计算锚点中心：使 Popover 从点击角标的精确中心生长出来
      const triggerCenterX = triggerRect.left + (triggerRect.width / 2);
      let originX = triggerCenterX - left;
      originX = Math.max(16, Math.min(originX, popoverWidth - 16));
      const originY = placement === 'top' ? 'bottom' : 'top';
      popover.style.setProperty('--transform-origin', `${Math.round(originX)}px ${originY}`);
    }

    function closeCitationPopover(){

      if(activeCitationTrigger){

        activeCitationTrigger = null;
      }
      window.clearTimeout(popoverCloseTimer);
      citationPopover.classList.remove('is-open');
      citationPopover.classList.add('is-closing');
      popoverCloseTimer = window.setTimeout(() => {
        citationPopover.classList.remove('is-closing');
      }, 140);

    function toggleCitationPopover(triggerEl, citation){
      if(!triggerEl || !citation) return;
      const popover = ensureCitationPopover();

      if(activeCitationTrigger === triggerEl && popover.classList.contains('is-open')){
        closeCitationPopover();

      window.clearTimeout(popoverCloseTimer);
      popover.classList.remove('is-closing');

        activeCitationTrigger.setAttribute('aria-expanded', 'false');
      }

      activeCitationTrigger = triggerEl;
      triggerEl.classList.add('is-active');
      triggerEl.setAttribute('aria-expanded', 'true');

      const id = citation.id != null ? citation.id : '';
      const isWeb = citation.source === 'web';
      const fileTitle = citation.file_title || citation.title || (isWeb ? '网络搜索' : '知识库手册');

      // 智能识别有效章节：去除开头的 markdown 标记，过滤空值、“正文/未注明章节”以及与手册名重复的情况
      const rawSection = cleanCitationSection(citation.section);
      const rawTitle = cleanCitationSection(citation.title);
      let meaningfulSection = '';
      if(rawSection && !['正文', '未注明章节', '正文 / 未注明章节'].includes(rawSection) && rawSection !== fileTitle){
        meaningfulSection = rawSection;

      const metaEl = popover.querySelector('#cit-pop-meta');

      copyLabel.textContent = '复制';
      copyBtn.classList.remove('is-copied');

      badgeEl.textContent = `[${id}]`;
      sourceEl.textContent = fileTitle;

      // 记录原始文本并渲染富文本 Markdown
      popover.dataset.rawContent = citation.content || '';
      textEl.innerHTML = renderCitationMarkdown(citation.content);
      textEl.scrollTop = 0;

      if(isWeb){
        iconEl.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`;
        if(citation.url){
          linkEl.hidden = false;
          linkEl.href = citation.url;
        }else{
          linkEl.hidden = true;
          linkEl.removeAttribute('href');
        }
      }else{
        iconEl.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;
        linkEl.hidden = true;
        linkEl.removeAttribute('href');
      }

      const hasItemName = Boolean(citation.item_name && String(citation.item_name).trim());
      if(meaningfulSection || hasItemName){
        metaEl.hidden = false;
        if(meaningfulSection){
          sectionEl.hidden = false;
          sectionEl.textContent = `§ ${meaningfulSection}`;
        }else{
          sectionEl.hidden = true;
          sectionEl.textContent = '';
        }

        if(hasItemName){
          itemEl.hidden = false;
          itemEl.textContent = citation.item_name;
        }else{

    // 匹配排除代码块、行内代码、Markdown 链接；目标匹配 [1] ~ [999999] 且后面不带 (
    const CITATION_TOKEN_REGEX = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`|!?\[[^\]\n]*\]\([^\n]*?\)|^\s*\[[^\]\n]+\]:[^\n]*|\[\d{1,6}\](?!\())/gm;

    function createCitationBadge(id, citation){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'citation-ref';
      btn.dataset.citationId = String(id);

      const fileTitle = citation.file_title || citation.title || (citation.source === 'web' ? '网页来源' : '手册');
      const section = citation.section ? ` · ${citation.section}` : '';
      btn.setAttribute('aria-label', `查看来源 [${id}]：${fileTitle}${section}`);
      btn.setAttribute('aria-expanded', 'false');
      btn.title = `[${id}] ${fileTitle}${section}`;
      btn.textContent = `[${id}]`;

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleCitationPopover(btn, citation);
      });
      return btn;
    }

    function renderTextWithCitations(containerEl, rawText, citations){
      containerEl.textContent = '';
      const text = String(rawText || '');
      if(!text) return;

      const citationsMap = new Map();
      if(Array.isArray(citations)){
        for(const item of citations){
          if(item && item.id != null){
            citationsMap.set(Number(item.id), item);
          }
        }
      }

      // 若无来源，原样渲染纯文本
      if(citationsMap.size === 0){
        containerEl.textContent = text;
        return;
      }

      CITATION_TOKEN_REGEX.lastIndex = 0;
      let lastIndex = 0;
      let match;

      while((match = CITATION_TOKEN_REGEX.exec(text)) !== null){
        if(match.index > lastIndex){
          containerEl.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        }

        const token = match[0];
        const numMatch = token.match(/^\[(\d{1,6})\]$/);
        if(numMatch){
          const cid = Number(numMatch[1]);
          const citation = citationsMap.get(cid);
          if(citation){
            // 编号存在于 citations：生成引用角标交互
            containerEl.appendChild(createCitationBadge(cid, citation));
          }else{
            // 不存在的编号：不要生成来源！原样保留普通文本 [id]
            containerEl.appendChild(document.createTextNode(token));
          }
        }else{
          // 代码块、行内代码、Markdown 链接等：原样保留文本
          containerEl.appendChild(document.createTextNode(token));
        }

        lastIndex = CITATION_TOKEN_REGEX.lastIndex;
      }

      if(lastIndex < text.length){
        containerEl.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls, citations = []){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      const contentText = (text || '').trim();
      const textEl = document.createElement('div');
      textEl.className = 'answer-text';

      if(contentText.length > 0){
        renderTextWithCitations(textEl, contentText, citations);
      }else{
        textEl.textContent = '（已完成，但未返回答案）';
      }
      containerEl.appendChild(textEl);

      if(images && images.length > 0){
        const gallery = document.createElement('div');
        gallery.className = 'answer-gallery';

        const header = document.createElement('div');
        header.className = 'answer-gallery-header';
        const heading = document.createElement('div');
        heading.className = 'answer-gallery-heading';
        const title = document.createElement('span');
        title.className = 'answer-gallery-title';
        title.textContent = '参考图片';
        const count = document.createElement('span');
        count.className = 'answer-gallery-count';
        heading.append(title, count);

        const controls = document.createElement('div');
        controls.className = 'answer-gallery-controls';
        const prevButton = document.createElement('button');
        prevButton.type = 'button';
        prevButton.className = 'answer-gallery-arrow';
        prevButton.setAttribute('aria-label', '向左浏览参考图片');
        prevButton.textContent = '←';
        const nextButton = document.createElement('button');
        nextButton.type = 'button';
        nextButton.className = 'answer-gallery-arrow';
        nextButton.setAttribute('aria-label', '向右浏览参考图片');
        nextButton.textContent = '→';
        controls.append(prevButton, nextButton);
        header.append(heading, controls);

        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        imgWrap.tabIndex = 0;
        imgWrap.setAttribute('role', 'region');
        imgWrap.setAttribute('aria-label', '参考图片，可使用左右方向键浏览');

        const updateGallery = () => {
          const imageCount = imgWrap.childElementCount;
          if(!imageCount){
            gallery.remove();
            return;
          }
          count.textContent = `共 ${imageCount} 张`;
          gallery.classList.toggle('is-single', imageCount === 1);
          imgWrap.classList.toggle('is-single', imageCount === 1);
          const maxScroll = Math.max(0, imgWrap.scrollWidth - imgWrap.clientWidth);
          controls.hidden = imageCount < 2 || maxScroll <= 2;
          prevButton.disabled = imgWrap.scrollLeft <= 2;
          nextButton.disabled = imgWrap.scrollLeft >= maxScroll - 2;
        };
        const slideImages = (direction) => {
          const firstCard = imgWrap.querySelector('.answer-image-card');
          if(!firstCard) return;
          const gap = parseFloat(getComputedStyle(imgWrap).columnGap) || 0;
          const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          imgWrap.scrollBy({
            left: direction * (firstCard.getBoundingClientRect().width + gap),
            behavior: reducedMotion ? 'auto' : 'smooth'
          });
        };
        prevButton.addEventListener('click', () => slideImages(-1));
        nextButton.addEventListener('click', () => slideImages(1));
        imgWrap.addEventListener('scroll', updateGallery, {passive: true});
        imgWrap.addEventListener('pointerdown', updateGallery, {passive: true});
        imgWrap.addEventListener('keydown', (event) => {
          if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          slideImages(event.key === 'ArrowRight' ? 1 : -1);
        });
        gallery.addEventListener('pointerenter', updateGallery);
        gallery.addEventListener('focusin', updateGallery);

        for(const [index, url] of images.entries()){
          const safeUrl = normalizeUrl(url);
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'answer-image-card';
          card.setAttribute('aria-label', `放大查看第 ${index + 1} 张参考图片`);
          card.addEventListener('click', () => openImageLightbox(safeUrl, `参考图片 ${index + 1}`));

          const preview = document.createElement('span');
          preview.className = 'answer-image-preview';
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.alt = `参考图片 ${index + 1}`;
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            card.remove();
            requestAnimationFrame(updateGallery);
          });
          img.src = safeUrl;
          preview.appendChild(img);

          const caption = document.createElement('span');
          caption.className = 'answer-image-caption';
          const label = document.createElement('span');
          label.textContent = `参考图片 ${String(index + 1).padStart(2, '0')}`;
          const action = document.createElement('span');
          action.textContent = '查看大图';
          caption.append(label, action);

          card.append(preview, caption);
          imgWrap.appendChild(card);
        }
        gallery.append(header, imgWrap);
        containerEl.appendChild(gallery);
        requestAnimationFrame(updateGallery);
      }
    }
