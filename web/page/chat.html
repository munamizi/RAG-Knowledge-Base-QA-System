<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>RAG 知识库 · 知识问答</title>
  <script>if(window.top !== window.self) document.documentElement.classList.add('embedded-view');</script>
  <style>
    :root{
      --bg:#f3f5f7;
      --panel:#ffffff;
      --text:#1f2d3d;
      --muted:#7a869a;
      --brand:#1aa7ff;
      --brand2:#5b7cfa;
      --bubble-user:#1aa7ff;
      --bubble-bot:#ffffff;
      --border:#e6e9ef;
      --shadow:0 10px 30px rgba(31,45,61,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(26,167,255,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(91,124,250,.18), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:980px;
      height:min(820px, 92vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(90deg, rgba(26,167,255,.10), rgba(91,124,250,.10));
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
    }
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 18px rgba(26,167,255,.25);
    }
    .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .title strong{font-size:14px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
    }
    .btn{
      border:none;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .chat{
      flex:1;
      overflow:auto;
      padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(26,167,255,.05), transparent 40%),
                 linear-gradient(0deg, rgba(91,124,250,.05), transparent 45%);
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 14px;
    }
    .msg{
      display:flex;
      gap:10px;
      margin:10px 0;
      align-items:flex-end;
    }
    .msg.user{justify-content:flex-end}
    /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .avatar{
      width:34px;height:34px;border-radius:10px;
      background:#e9eef7;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;
      color:#3b4a5a;
      flex:0 0 auto;
    }
    .avatar.bot{background:linear-gradient(135deg, rgba(26,167,255,.18), rgba(91,124,250,.18))}
    .bubble{
      max-width:min(720px, 76%);
      display:inline-block;
      border-radius:14px;
      padding:10px 12px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap: break-word;
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-color:transparent;
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
    }
    .msg.user .meta{color:rgba(255,255,255,.85)}
    details.progress{
      margin-top:8px;
      border:1px dashed rgba(122,134,154,.45);
      border-radius:12px;
      padding:8px 10px;
      background:rgba(122,134,154,.06);
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:var(--muted);
      font-size:12px;
    }
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;color:#56657a}

    .answer-images{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .answer-images img{
      display: block;
      max-width: min(100%, 600px);
      max-height: 600px;
      width: auto;
      height: auto;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(31,45,61,.10);
      background:#fff;
    }
    .answer-images a{
      font-size:12px;
      color:var(--muted);
      text-decoration:none;
      word-break:break-all;
    }

    .typing{
      display:inline-flex;gap:6px;align-items:center;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:#9aa6b2;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-5px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:12px 14px;
      display:flex;
      gap:10px;
      align-items:flex-end;
      background:#fff;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;
      max-height:140px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
    }
    textarea:focus{border-color:rgba(26,167,255,.6); box-shadow:0 0 0 3px rgba(26,167,255,.12)}
    .send{
      width:88px;
      height:44px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      padding:0 14px 12px;
      color:var(--muted);
      font-size:12px;
      background:#fff;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#f7f9fc;
      color:#3b4a5a;
    }
  </style>
  <style>
    /* Claude-inspired：暖色、中性、内容优先 */
    :root{
      color-scheme:light;
      --bg:#f6f4f0;--panel:#fffdfa;--text:#2d2a26;--muted:#7a756f;
      --brand:#d97757;--brand2:#d97757;--bubble-user:#eeeae4;
      --bubble-bot:transparent;--border:#e5dfd7;--soft:#f3f0eb;
      --shadow:0 16px 44px rgba(59,49,39,.08);
    }
    *{scrollbar-width:thin;scrollbar-color:#cfc7bd transparent}
    *::-webkit-scrollbar{width:8px;height:8px}
    *::-webkit-scrollbar-thumb{background:#d6cfc6;border:2px solid transparent;border-radius:8px;background-clip:padding-box}
    body{
      min-height:100dvh;height:auto;padding:24px;overflow:hidden;
      color:var(--text);background:var(--bg);
      font-family:"MiSans","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .app{
      width:100%;max-width:1040px;height:min(880px,calc(100dvh - 48px));
      border:1px solid var(--border);border-radius:20px;background:var(--panel);
      box-shadow:var(--shadow);overflow:hidden;
    }
    .topbar{
      min-height:70px;padding:14px 18px;border-bottom:1px solid var(--border);
      background:rgba(255,253,250,.96);
    }
    .brand{gap:11px;min-width:220px}
    .logo{
      position:relative;width:38px;height:38px;flex:0 0 38px;border-radius:12px;
      background:#d97757;box-shadow:none;font-size:0;
    }
    .logo::before{
      content:"R";position:absolute;inset:0;display:grid;place-items:center;
      color:#fffaf5;font-family:"STSong","Songti SC",serif;font-size:17px;font-weight:700;
    }
    .title strong{color:#332f2b;font-size:15px;font-weight:650;letter-spacing:.01em}
    .title span{margin-top:4px;color:#8a847d;font-size:11px}
    .top-actions{gap:8px}
    .top-actions label{
      min-height:30px;margin-right:2px!important;padding:5px 7px;
      color:#77716a!important;font-size:11px!important;
    }
    #streamToggle{accent-color:#d97757}
    .pill{
      min-height:30px;padding:6px 10px;color:#716b64;border:0;border-radius:9px;
      background:#f2eee8;font-size:11px;
    }
    .pill::before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#67916f}
    .btn{
      min-height:32px;padding:6px 10px;color:#68625c;border:0;border-radius:9px;
      background:transparent;font-size:11px;transition:background-color .15s ease,color .15s ease;
    }
    .btn:hover{color:#332f2b;background:#f2eee8}
    .chat{
      flex:1;padding:30px clamp(20px,6vw,72px) 22px;overflow:auto;
      background:#fbfaf8;
    }
    .dayline{margin:0 0 26px;color:#9b958e;font-size:11px}
    .msg{margin:19px 0;gap:11px;align-items:flex-start}
    .msg.user{justify-content:flex-end}
    .msg>div:not(.avatar){min-width:0;flex:1}
    .msg.user>div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end}
    .avatar{
      width:30px;height:30px;flex:0 0 30px;border:1px solid #ddd6cd;border-radius:10px;
      color:#6f6962;background:#f2eee8;box-shadow:none;font-size:11px;
    }
    .avatar.bot{
      color:#fff9f3;border-color:#b95b40;border-radius:11px;
      background:linear-gradient(145deg,#cf7455 0%,#b95a40 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 5px 14px rgba(82,49,38,.12);
      font-family:"STSong","Songti SC",serif;font-size:0;
    }
    .avatar.bot::before{content:none}
    .assistant-glyph{
      display:block;width:21px;height:21px;overflow:visible;
      fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;
    }
    .msg.user .avatar{display:none}
    .bubble{
      max-width:min(760px,86%);padding:1px 0;color:#37332f;border:0;border-radius:0;
      background:transparent;box-shadow:none;font-size:14px;line-height:1.76;
    }
    .msg.user .bubble{
      max-width:min(650px,76%);padding:10px 14px;color:#3b3733;border:0;
      border-radius:16px 16px 5px 16px;background:#eeeae4;box-shadow:none;
    }
    .meta,.msg.user .meta{margin-top:6px;color:#9b958e;font-size:10px}
    details.progress{
      margin-top:13px;padding:9px 11px;border:1px solid #e4ddd5;border-radius:11px;
      background:#f5f1ec;
    }
    details.progress summary{color:#746d66;font-size:11px}
    .progress li{margin:5px 0;color:#6f6962;font-size:11px}
    .answer-images img{border:1px solid #e2dbd2;border-radius:12px;box-shadow:none}
    .answer-images a{color:#a15e49;font-size:10px;text-decoration:underline;text-underline-offset:3px}
    .typing{gap:5px}.dot{width:5px;height:5px;background:#c57b62}
    .composer{
      margin:12px 18px 0;padding:7px 7px 7px 14px;gap:8px;
      border:1px solid #dcd5cc;border-radius:18px;background:#fff;
      box-shadow:0 7px 24px rgba(61,50,40,.07);
    }
    textarea{
      min-height:44px;padding:10px 2px;color:#342f2b;border:0;border-radius:0;
      background:transparent;font-size:14px;box-shadow:none;
    }
    textarea::placeholder{color:#9d968e}
    textarea:focus{border:0;box-shadow:none}
    .send{
      width:76px;height:42px;color:#fffaf5;border:0;border-radius:12px;
      background:#d97757;box-shadow:none;font-size:13px;font-weight:650;
      transition:background-color .15s ease,transform .15s ease;
    }
    .send:hover:not(:disabled){background:#c96749;transform:translateY(-1px)}
    .hint{padding:8px 24px 13px;color:#969088;background:var(--panel);font-size:10px}
    .kbd{padding:1px 5px;color:#706a63;border:1px solid #ded7cf;border-radius:5px;background:#f3f0eb}
    button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid rgba(217,119,87,.55);outline-offset:2px}
    @media(max-width:720px){
      body{padding:0}.app{height:100dvh;border:0;border-radius:0;box-shadow:none}
      .topbar{min-height:auto;padding:12px 13px;flex-wrap:wrap}.brand{min-width:0;flex:1 1 180px}
      .title span{display:none}.top-actions{flex:1 1 100%;justify-content:flex-end}
      .chat{padding:22px 16px 17px}.msg{gap:9px}.bubble{max-width:91%}.msg.user .bubble{max-width:86%}
      .composer{margin:8px 10px 0;padding-left:12px}.send{width:68px;flex-basis:68px}.hint{display:none}
    }
    @media(max-width:430px){.pill{display:none}.top-actions label{margin-left:auto}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <style>
    /* 2026 UI refresh：知识索引工作台 */
    :root{
      --canvas:#eceae4;
      --paper:#f8f7f3;
      --paper-strong:#ffffff;
      --ink:#242925;
      --muted:#777b75;
      --line:#deddd6;
      --rail:#202723;
      --rail-muted:#aeb7b0;
      --accent:#c86446;
      --accent-soft:#f3e1da;
      --success:#5f8568;
      --shadow:0 24px 70px rgba(37,42,38,.14);
    }
    html,body{height:100%}
    body{
      position:relative;height:100dvh;min-height:0;padding:20px;overflow:hidden;
      background:
        linear-gradient(rgba(39,47,42,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(39,47,42,.035) 1px,transparent 1px),
        var(--canvas);
      background-size:32px 32px;
      color:var(--ink);
      font-family:"MiSans","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:linear-gradient(115deg,rgba(255,255,255,.42),transparent 34% 67%,rgba(200,100,70,.035));
    }
    .app{
      position:relative;display:flex;flex-direction:column;
      width:min(1180px,100%);max-width:none;height:min(900px,calc(100dvh - 40px));
      border:1px solid rgba(31,39,35,.12);border-radius:24px;overflow:hidden;
      background:var(--paper);box-shadow:var(--shadow);
    }
    .workspace{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column;background:var(--paper)}
    .site-header{display:flex;align-items:center;min-height:70px;padding:13px 20px;border-bottom:1px solid var(--line);background:rgba(248,247,243,.94);backdrop-filter:blur(12px)}
    .site-brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
    .site-mark{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px;color:var(--accent)}
    .site-mark svg{width:30px;height:30px;overflow:visible}
    .site-mark path{fill:none;stroke:#868b85;stroke-width:1.35;stroke-linecap:round}
    .site-mark circle{fill:var(--paper);stroke:var(--accent);stroke-width:1.35}
    .site-mark circle:nth-of-type(2){fill:var(--accent)}
    .site-brand strong{display:block;font-size:13px;font-weight:650;letter-spacing:.04em}.site-brand small{display:block;margin-top:3px;color:var(--muted);font:8px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
    .site-nav{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#efeee8}
    .site-nav a{display:flex;align-items:center;gap:7px;min-height:31px;padding:6px 10px;border-radius:8px;color:#737872;text-decoration:none;font-size:10px;transition:background-color .16s ease,color .16s ease}
    .site-nav a:hover{color:var(--ink)}.site-nav a.active{color:var(--ink);background:#fff;box-shadow:0 2px 7px rgba(36,41,37,.08)}
    .site-nav svg{width:14px;height:14px;stroke:currentColor}
    .index-rail{
      position:relative;display:flex;flex-direction:column;min-height:0;padding:22px 16px 18px;
      color:#f4f1eb;background:var(--rail);overflow:hidden;
    }
    .index-rail::after{
      content:"";position:absolute;left:38px;top:102px;bottom:30px;width:1px;
      background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.025));pointer-events:none;
    }
    .rail-brand{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:0 6px 24px}
    .rail-mark{
      width:42px;height:42px;display:grid;place-items:center;flex:0 0 42px;
      border:1px solid rgba(255,255,255,.13);border-radius:13px;color:#fff8f2;
      background:var(--accent);font-family:"Songti SC","STSong",serif;font-size:19px;font-weight:700;
      box-shadow:0 9px 24px rgba(0,0,0,.18);
    }
    .rail-brand strong{display:block;font-size:14px;font-weight:650;letter-spacing:.04em}
    .rail-brand span{display:block;margin-top:4px;color:var(--rail-muted);font:9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em;text-transform:uppercase}
    .rail-label{position:relative;z-index:1;margin:12px 10px 8px;color:#7f8a82;font:9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
    .rail-nav{position:relative;z-index:1;display:grid;gap:6px}
    .rail-link{
      display:flex;align-items:center;gap:11px;min-height:42px;padding:9px 11px;
      color:var(--rail-muted);border:1px solid transparent;border-radius:11px;text-decoration:none;
      font-size:12px;transition:color .16s ease,background-color .16s ease,border-color .16s ease;
    }
    .rail-link svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor}
    .rail-link:hover{color:#fff;background:rgba(255,255,255,.055)}
    .rail-link.active{color:#fff5ef;border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.085)}
    .rail-link.active::before{content:"";width:3px;height:16px;margin-left:-12px;border-radius:0 4px 4px 0;background:var(--accent)}
    .rail-note{position:relative;z-index:1;margin-top:auto;padding:14px 11px 2px 22px;color:#8f9a92;font-size:10px;line-height:1.65}
    .rail-note::before{content:"";position:absolute;left:4px;top:19px;width:6px;height:6px;border-radius:50%;background:#739a7c;box-shadow:0 0 0 4px rgba(115,154,124,.1)}
    .topbar{
      min-height:62px;padding:11px 22px;gap:14px;border-bottom:1px solid var(--line);
      background:#f3f2ed;
    }
    .brand{min-width:0;gap:0}.brand>.logo{display:none}
    .title{gap:1px}.title strong{font-family:"Songti SC","STSong",serif;font-size:18px;font-weight:700;letter-spacing:.015em;color:var(--ink)}
    .title span{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.02em}
    .top-actions{gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .stream-switch{min-height:32px!important;margin:0!important;padding:5px 9px!important;gap:7px!important;border:1px solid var(--line);border-radius:9px;background:#fff;color:#666b66!important}
    .stream-switch input{width:14px;height:14px;margin:0;accent-color:var(--accent)}
    .pill{position:relative;min-height:32px;padding:7px 10px 7px 22px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#70756f;font-size:10px}
    .pill::before{position:absolute;left:10px;top:50%;width:6px;height:6px;margin:0;transform:translateY(-50%);background:#9b9e9a}
    .pill[data-state="online"]::before{background:var(--success);box-shadow:0 0 0 3px rgba(95,133,104,.12)}
    .btn{min-height:32px;padding:7px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:#6e726d;font-size:10px}
    .btn:hover{color:var(--ink);border-color:var(--line);background:#fff}
    .chat{
      position:relative;flex:1;min-height:0;padding:26px clamp(22px,7vw,84px) 30px;
      background:var(--paper);scroll-behavior:smooth;
    }

  <script>
    // 后端页面使用同源接口；file:// 或 IDE 预览时固定访问 FastAPI 的 8000 端口
    const API_BASE = location.port === '8000' ? location.origin : 'http://127.0.0.1:8000';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    let followStreamOutput = true;
    let autoScrollReleaseFrame = 0;

    function isNearChatBottom(threshold = 72){
      return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight <= threshold;
    }

    function scrollToBottom(force = true){
      if(!force && !followStreamOutput) return;

      if(autoScrollReleaseFrame){
        cancelAnimationFrame(autoScrollReleaseFrame);
      }

      chatEl.dataset.autoScrolling = 'true';
      chatEl.scrollTop = chatEl.scrollHeight;
      autoScrollReleaseFrame = requestAnimationFrame(() => {
        delete chatEl.dataset.autoScrolling;
        autoScrollReleaseFrame = 0;
      });
    }

    chatEl.addEventListener('scroll', () => {
      if(chatEl.dataset.autoScrolling === 'true') return;
      followStreamOutput = isNearChatBottom();
    }, {passive:true});
    function syncComposerHeight(){
      inputEl.style.height = 'auto';
      const contentHeight = inputEl.scrollHeight;
      inputEl.style.height = `${Math.min(Math.max(contentHeight, 42), 145)}px`;
      inputEl.style.overflowY = contentHeight > 145 ? 'auto' : 'hidden';
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];

      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot" aria-label="知识库助手">
            <svg class="assistant-glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5.5c.72 4.35 2.15 5.78 6.5 6.5-4.35.72-5.78 2.15-6.5 6.5-.72-4.35-2.15-5.78-6.5-6.5 4.35-.72 5.78-2.15 6.5-6.5Z"/>
              <circle cx="19.2" cy="19.1" r="2.15"/>
            </svg>
          </div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(isStream = true){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const responseMode = isStream ? 'stream' : 'blocking';
      const waitingContent = isStream
        ? '<span class="typing" aria-label="正在思考"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>'
        : '<span class="blocking-thinking" role="status" aria-live="polite"><span class="blocking-thinking-track" aria-hidden="true"></span><span>正在整合完整回答</span></span>';
      const html = `
        <div class="msg bot" id="${id}" data-response-mode="${responseMode}">
          <div class="avatar bot" aria-label="知识库助手">
            <svg class="assistant-glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5.5c.72 4.35 2.15 5.78 6.5 6.5-4.35.72-5.78 2.15-6.5 6.5-.72-4.35-2.15-5.78-6.5-6.5 4.35-.72 5.78-2.15 6.5-6.5Z"/>
              <circle cx="19.2" cy="19.1" r="2.15"/>
            </svg>
          </div>
          <div>
            <div class="bubble${isStream ? '' : ' is-blocking-wait'}">${waitingContent}</div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    const progressStageRules = [
      /确认|item[_\s-]*name/i,
      /切片搜索|向量搜索|search[_\s-]*embedding/i,
      /网络|web[_\s-]*search/i,
      /hyde|假设性文档/i,
      /倒排融合|rrf|结果融合/i,
      /重排序|rerank/i,
      /生成答案|answer[_\s-]*output/i,
    ];

    function getProgressStageRank(text){
      const value = String(text || '');
      if(progressStageRules[3].test(value)) return 3;
      for(let index = 0; index < progressStageRules.length; index++){
        if(progressStageRules[index].test(value)) return index;
      }
      return 100;
    }

    function measureProgressCollapsedWidth(details){
      const summary = details.querySelector('summary');
      if(!summary) return 160;

      const probe = document.createElement('details');
      probe.className = 'progress progress-measure is-collapsed';
      probe.open = true;
      probe.appendChild(summary.cloneNode(true));
      document.body.appendChild(probe);
      const width = Math.ceil(probe.getBoundingClientRect().width);
      probe.remove();
      return Math.max(140, width);
    }

    function getProgressExpandedWidth(details){
      const bubble = details.closest('.bubble');
      const widthLimit = window.matchMedia('(max-width: 560px)').matches ? 244 : 252;
      const availableWidth = bubble ? bubble.getBoundingClientRect().width : widthLimit;
      return Math.max(1, Math.min(widthLimit, Math.floor(availableWidth)));
    }

    function setProgressExpanded(details, expanded, options = {}){
      const body = details.querySelector('.progress-body');
      const summary = details.querySelector('summary');
      if(!body || !summary) return;

      window.clearTimeout(Number(details.dataset.progressAnimationTimer || 0));
      delete details.dataset.progressAnimationTimer;
      details.open = true;

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const instant = Boolean(options.instant) || reduceMotion;
      const currentlyExpanded = !details.classList.contains('is-collapsed');
      const isAnimating = details.classList.contains('is-animating');

      summary.setAttribute('aria-expanded', String(expanded));

      if(currentlyExpanded === expanded && !isAnimating){
        body.style.height = expanded ? 'auto' : '0px';
        details.style.width = '';
        details.open = expanded;
        return;
      }

      const currentHeight = body.getBoundingClientRect().height;
      const currentWidth = details.getBoundingClientRect().width;
      const targetHeight = expanded ? body.scrollHeight : 0;
      const targetWidth = expanded
        ? getProgressExpandedWidth(details)
        : measureProgressCollapsedWidth(details);

      details.style.width = `${currentWidth}px`;
      body.style.height = `${currentHeight}px`;
      details.classList.remove('is-animating');
      details.classList.toggle('is-collapsed', !expanded);

      if(instant){
        body.style.height = expanded ? 'auto' : '0px';
        details.style.width = '';
        details.open = expanded;
        return;
      }

      void details.offsetWidth;
      details.classList.add('is-animating');

      requestAnimationFrame(() => {
        details.style.width = `${targetWidth}px`;
        body.style.height = `${targetHeight}px`;
      });

      const animationTimer = window.setTimeout(() => {
        details.classList.remove('is-animating');
        body.style.height = expanded ? 'auto' : '0px';
        details.style.width = '';
        details.open = expanded;
        delete details.dataset.progressAnimationTimer;
      }, 520);
      details.dataset.progressAnimationTimer = String(animationTimer);
    }

    function ensureProgress(botMsgEl){
      let details = botMsgEl.querySelector('details.progress');
      if(details) return details;

      details = document.createElement('details');
      details.className = 'progress';
      details.dataset.status = 'pending';
      details.open = true;
      details.innerHTML = `
        <summary>
          <span class="progress-state">正在准备</span>
          <span class="progress-count">等待任务</span>
        </summary>
        <div class="progress-body"><ul></ul></div>
      `;

      const bubble = botMsgEl.querySelector('.bubble');
      bubble.classList.add('has-progress');
      const answer = bubble.querySelector('.answer');
      if(answer) bubble.insertBefore(details, answer);
      else bubble.appendChild(details);

      const summary = details.querySelector('summary');
      summary.setAttribute('aria-expanded', 'true');
      summary.addEventListener('click', (event) => {
        event.preventDefault();
        setProgressExpanded(details, details.classList.contains('is-collapsed'));
      });
      return details;
    }

    function refreshProgressLinks(ul){
      const items = Array.from(ul.children);
      items.forEach((item, index) => {
        const next = items[index + 1];
        const currentState = item.dataset.state;
        const nextState = next ? next.dataset.state : '';
        item.classList.toggle('is-passed-link', Boolean(next && nextState === 'done'));
        item.classList.toggle(
          'is-current-link',
          Boolean(next && currentState === 'done' && nextState === 'running'),
        );
      });
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = ensureProgress(botMsgEl);
      const stateEl = details.querySelector('.progress-state');
      const countEl = details.querySelector('.progress-count');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;
      const normalizedStatus = status || 'pending';
      const fingerprint = JSON.stringify({
        done,
        running,
        status: normalizedStatus,
      });

      const typing = botMsgEl.querySelector('.typing');
      if(typing) typing.remove();

      if(!details.dataset.initialized){
        details.dataset.initialized = 'true';
        details.open = true;
        details.classList.remove('is-collapsed');
      }

      if(details.dataset.fingerprint === fingerprint) return;
      details.dataset.fingerprint = fingerprint;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || '等待中';
      const stateCopy = status === 'completed' ? '处理完成' : status === 'failed' ? '处理遇到问题' : status === 'pending' ? '正在准备' : '正在理解与检索';
      details.dataset.status = normalizedStatus;
      if(stateEl.textContent !== stateCopy) stateEl.textContent = stateCopy;
      const countCopy = totalDone || totalRun ? `${totalDone} 已完成 · ${totalRun} 进行中` : displayStatus;
      if(countEl.textContent !== countCopy) countEl.textContent = countCopy;

      const stepState = new Map();
      running.forEach((text, index) => {
        const value = String(text);
        stepState.set(value, {text:value, state:'running', sourceIndex:index});
      });
      done.forEach((text, index) => {
        const value = String(text);
        stepState.set(value, {text:value, state:'done', sourceIndex:index});
      });
      const steps = Array.from(stepState.values()).sort((left, right) => {
        const rankDiff = getProgressStageRank(left.text) - getProgressStageRank(right.text);
        return rankDiff || left.sourceIndex - right.sourceIndex;
      });

      const existing = new Map(Array.from(ul.children).map((item) => [item.dataset.step, item]));
      let enteringIndex = 0;
      let insertedNode = false;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      steps.forEach((step, index) => {
        const key = step.text;
        const stageRank = getProgressStageRank(step.text);
        const orderKey = stageRank * 1000 + index;
        let item = existing.get(key);

        if(!item){
          item = document.createElement('li');
          item.className = 'progress-step';
          item.dataset.step = key;
          item.dataset.order = String(orderKey);
          item.innerHTML = `<span class="progress-node" aria-hidden="true"></span><span class="progress-text">${escapeHtml(step.text)}</span>`;
          item.style.setProperty('--enter-delay', `${enteringIndex * 85}ms`);
          enteringIndex += 1;

          const anchor = Array.from(ul.children).find(
            child => Number(child.dataset.order || Number.MAX_SAFE_INTEGER) > orderKey,
          );
          ul.insertBefore(item, anchor || null);
          existing.set(key, item);
          insertedNode = true;
        }

        const previousState = item.dataset.state;
        item.dataset.state = step.state;
        item.classList.toggle('is-done', step.state === 'done');
        item.classList.toggle('is-running', step.state === 'running');

        if(previousState && previousState !== step.state && !reduceMotion){
          const node = item.querySelector('.progress-node');
          if(node && typeof node.animate === 'function'){
            node.animate(
              [
                {transform:'scale(1)'},
                {transform:'scale(1.22)'},
                {transform:'scale(1)'},
              ],
              {
                duration:360,
                easing:'cubic-bezier(.22,1,.36,1)',
              },
            );
          }
        }
      });

      refreshProgressLinks(ul);

      if(insertedNode){
        const body = details.querySelector('.progress-body');
        if(
          body &&
          details.classList.contains('is-animating') &&
          !details.classList.contains('is-collapsed')
        ){
          requestAnimationFrame(() => {
            body.style.height = `${body.scrollHeight}px`;
          });
        }
      }

      if(normalizedStatus === 'completed' || normalizedStatus === 'failed'){
        settleProgress(botMsgEl, normalizedStatus);
      }
    }

    function settleProgress(botMsgEl, status = 'completed'){
      const details = botMsgEl.querySelector('details.progress');
      if(!details) return;

      window.clearTimeout(Number(details.dataset.collapseTimer || 0));
      details.dataset.status = status;

      const stateEl = details.querySelector('.progress-state');
      const countEl = details.querySelector('.progress-count');
      const steps = Array.from(details.querySelectorAll('.progress-step'));

      if(status === 'completed'){
        for(const item of steps){
          item.dataset.state = 'done';
          item.classList.remove('is-running');
          item.classList.add('is-done');
        }
        const ul = details.querySelector('ul');
        if(ul) refreshProgressLinks(ul);
        stateEl.textContent = '处理完成';
        countEl.textContent = `${steps.length} 已完成`;
      }else{
        stateEl.textContent = '处理遇到问题';
      }

      const collapseDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ? 0
        : status === 'completed' ? 520 : 680;

      const timer = window.setTimeout(() => {
        setProgressExpanded(details, false);
        delete details.dataset.collapseTimer;
      }, collapseDelay);
      details.dataset.collapseTimer = String(timer);
    }

    const answerGraphemeSegmenter = (
      typeof Intl !== 'undefined' &&
      typeof Intl.Segmenter === 'function'
    ) ? new Intl.Segmenter('zh-CN', {granularity:'grapheme'}) : null;

    function splitAnswerUnits(text){
      const value = String(text || '');
      if(!answerGraphemeSegmenter) return Array.from(value);
      return Array.from(answerGraphemeSegmenter.segment(value), item => item.segment);
    }

    function getRevealAnswerText(answerText, useFallback = false){
      const { text } = parseAnswerAndImages(answerText);
      if((text || '').trim().length > 0) return text;
      return useFallback ? '（已完成，但未返回答案）' : '';
    }

    function createTextRevealController(containerEl, options = {}){
      let textEl = containerEl.querySelector('.answer-text');
      if(!textEl){
        containerEl.replaceChildren();
        textEl = document.createElement('div');
        textEl.className = 'answer-text';
        containerEl.appendChild(textEl);
      }

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const finalDrainMs = Math.max(320, Number(options.finalDrainMs) || 720);
      const onFrame = typeof options.onFrame === 'function' ? options.onFrame : () => {};
      let targetUnits = [];
      let renderedUnits = [];
      let frameId = 0;
      let previousTime = 0;
      let characterBudget = 0;
      let finishing = false;
      let finalRate = 0;
      let idleResolvers = [];

      const resolveIdle = () => {
        textEl.classList.remove('is-generating');
        containerEl.setAttribute('aria-busy', 'false');
        const resolvers = idleResolvers;
        idleResolvers = [];
        for(const resolve of resolvers) resolve();
      };

      const renderImmediately = () => {
        renderedUnits = targetUnits.slice();
        textEl.textContent = renderedUnits.join('');
        onFrame();
        if(finishing) resolveIdle();
      };

      const getStreamingRate = (backlog) => {
        if(backlog > 180) return 190;
        if(backlog > 90) return 125;
        if(backlog > 36) return 82;
        if(backlog > 14) return 55;
        return 34;
      };

      const tick = (time) => {
        frameId = 0;
        const backlog = targetUnits.length - renderedUnits.length;
        if(backlog <= 0){
          if(finishing) resolveIdle();
          return;
        }

        const elapsed = previousTime ? Math.min(Math.max(time - previousTime, 0), 50) : 16.7;
        previousTime = time;
        const rate = finishing ? finalRate : getStreamingRate(backlog);
        characterBudget += elapsed * rate / 1000;
        const count = Math.min(backlog, Math.floor(characterBudget));

        if(count > 0){
          characterBudget -= count;
          renderedUnits.push(
            ...targetUnits.slice(renderedUnits.length, renderedUnits.length + count),
          );
          textEl.textContent = renderedUnits.join('');
          onFrame();
        }

        if(renderedUnits.length < targetUnits.length){
          frameId = requestAnimationFrame(tick);
        }else if(finishing){
          resolveIdle();
        }
      };

      const start = () => {
        containerEl.setAttribute('aria-busy', 'true');
        textEl.classList.add('is-generating');
        if(reduceMotion){
          renderImmediately();
          return;
        }
        if(!frameId) frameId = requestAnimationFrame(tick);
      };

      const setTarget = (text) => {
        const nextUnits = splitAnswerUnits(text);
        const wasAnimating = Boolean(frameId);
        let commonLength = 0;
        const comparableLength = Math.min(renderedUnits.length, nextUnits.length);
        while(
          commonLength < comparableLength &&
          renderedUnits[commonLength] === nextUnits[commonLength]
        ){
          commonLength += 1;
        }

        if(commonLength < renderedUnits.length){
          renderedUnits = nextUnits.slice(0, commonLength);
          textEl.textContent = renderedUnits.join('');
          characterBudget = 0;
        }

        targetUnits = nextUnits;
        if(!wasAnimating) previousTime = 0;
        start();
      };

      const finish = (text) => new Promise((resolve) => {
        finishing = true;
        idleResolvers.push(resolve);
        setTarget(text);
        const backlog = Math.max(0, targetUnits.length - renderedUnits.length);
        finalRate = Math.max(42, backlog * 1000 / finalDrainMs);
        if(backlog === 0){
          if(frameId) cancelAnimationFrame(frameId);
          frameId = 0;
          resolveIdle();
        }
      });

      const cancel = () => {
        if(frameId) cancelAnimationFrame(frameId);
        frameId = 0;
        finishing = true;
        resolveIdle();
      };

      return { setTarget, finish, cancel };
    }

    async function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const isBlocking = botMsgEl.dataset.responseMode === 'blocking';
      const err = (error || '').trim();
      const answerEl = document.createElement('div');
      answerEl.className = `answer${isBlocking ? ' is-blocking-result' : ''}`;
      answerEl.setAttribute('aria-live', 'polite');

      bubble.classList.remove('is-blocking-wait');
      bubble.replaceChildren();
      if(progress) bubble.appendChild(progress);
      bubble.appendChild(answerEl);

      if(err){
        answerEl.textContent = `抱歉，本次处理失败：\n${err}`;
        settleProgress(botMsgEl, 'failed');
      }else{
        const reveal = createTextRevealController(answerEl, {
          finalDrainMs: isBlocking ? 1450 : 680,
          onFrame: () => scrollToBottom(false),
        });
        await reveal.finish(getRevealAnswerText(answer, true));
        renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
        settleProgress(botMsgEl, 'completed');
      }

      scrollToBottom(false);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
        apiPill.dataset.state = 'online';
      }catch(e){
        apiPill.textContent = `API: 未连接`;
        apiPill.dataset.state = 'offline';
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 保留首条欢迎消息，其余先清空再渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            clearInterval(interval);
            await finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            clearInterval(interval);
            await finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      const isStream = streamToggle.checked;
      followStreamOutput = true;
      chatEl.classList.toggle('is-streaming', isStream);
      inputEl.value = '';
      syncComposerHeight();
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton(isStream);
      sendBtn.disabled = true;

      try{
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);

        if (!isStream) {
          // 非流式：等待完整响应后直接展示答案，不创建流式节点进度面板
          await finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          chatEl.classList.remove('is-streaming');
          sendBtn.disabled = false;
          return;
        }

        // 流式：收到任务标识后创建节点进度面板
        renderProgress(botMsgEl, [], [], 'pending');

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id

        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          answerEl.setAttribute('aria-live', 'polite');
          bubble.appendChild(answerEl);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';
        let streamFinished = false;
        const textReveal = createTextRevealController(answerEl, {
          finalDrainMs: 620,
          onFrame: () => scrollToBottom(false),
        });

        const stopStreamingUi = () => {
          chatEl.classList.remove('is-streaming');
        };

        const completeStream = async (event) => {
          if(streamFinished) return;
          streamFinished = true;
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          es.close();

          let finalText = rawAnswerText || answerEl.textContent || '';
          let finalImageUrls = [];
          try{
            const d = JSON.parse(event.data || '{}');
            finalText = (
              d &&
              typeof d.answer === 'string' &&
              d.answer.trim().length > 0
            ) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            finalImageUrls = d.image_urls || [];
          }catch(_){}

          await textReveal.finish(getRevealAnswerText(finalText, true));
          renderAnswerWithImages(answerEl, finalText, finalImageUrls);
          settleProgress(botMsgEl, 'completed');
          stopStreamingUi();
          scrollToBottom(false);
          sendBtn.disabled = false;
        };

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          if(streamFinished) return;
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              textReveal.setTarget(getRevealAnswerText(rawAnswerText));
            }
          }catch(_){}
        });

        es.addEventListener('final', completeStream);
        es.addEventListener('final_answer', completeStream);

        es.addEventListener('error', (e) => {
          if(streamFinished) return;
          streamFinished = true;
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          textReveal.cancel();
          stopStreamingUi();

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          settleProgress(botMsgEl, 'failed');
          scrollToBottom(false);
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        chatEl.classList.remove('is-streaming');
        await finalizeBotAnswer(
          botMsgEl,
          '',
          `请求失败：${e.message || e}`,
          [],
        );
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('input', syncComposerHeight);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空除首条欢迎消息外的内容
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    syncComposerHeight();
    setTimeout(() => inputEl.focus(), 200);
  </script>
  <script>
    (() => {
      const routeRevealTimers = new WeakMap();
      const settleChatReveal = (target) => {
        const scope = target === document.documentElement ? document : target;
        for(const element of scope.querySelectorAll('.topbar, .dayline, .msg, .composer')) {
          element.classList.add('route-motion-settled');
        }
        target.classList.remove('route-entering');
        routeRevealTimers.delete(target);
      };

      const replayChatReveal = (target = document.documentElement) => {
        const activeTimer = routeRevealTimers.get(target);
        if(activeTimer) window.clearTimeout(activeTimer);
        target.classList.remove('route-entering');
        void target.offsetWidth;
        target.classList.add('route-entering');
        routeRevealTimers.set(target, window.setTimeout(() => settleChatReveal(target), 720));
      };

      window.addEventListener('message', (event) => {
        if(event.source !== window.parent || event.data !== 'rag:route-enter') return;
        if(location.protocol !== 'file:' && event.origin !== location.origin) return;
        replayChatReveal();
      });

      if(window.top !== window.self) return;

      const nav = document.querySelector('.site-nav');
      const links = Array.from(nav.querySelectorAll('a'));
      const brandLink = document.querySelector('.site-brand');
      const views = Array.from(document.querySelectorAll('[data-app-view]'));
      const remoteFrame = document.querySelector('iframe[data-app-view]');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let currentView = views.find((view) => view.classList.contains('is-active'))?.dataset.appView || 'chat';
      let switching = false;
      let pendingSwitch = null;
      const delay = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      const viewFromPath = () => /import\.html$/i.test(location.pathname) ? 'import' : 'chat';
      const viewFromLink = (link) => /import\.html(?:$|[?#])/i.test(link.getAttribute('href') || '') ? 'import' : 'chat';

      function updateNavigation(viewName) {
        for(const link of links) {
          const active = viewFromLink(link) === viewName;
          link.classList.toggle('active', active);
          if(active) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        }
      }

      function updateView(viewName) {
        for(const view of views) {
          const active = view.dataset.appView === viewName;
          view.hidden = !active;
          view.classList.toggle('is-active', active);
          view.setAttribute('aria-hidden', String(!active));
        }
        updateNavigation(viewName);
        currentView = viewName;
        document.title = viewName === 'chat' ? 'RAG 知识库 · 知识问答' : 'RAG 知识库 · 资料导入';
      }

      function prepareViewReveal(viewName, incoming) {
        if(!incoming) return;
        if(incoming instanceof HTMLIFrameElement) {
          const targetOrigin = location.protocol === 'file:' ? '*' : location.origin;
          incoming.contentWindow?.postMessage('rag:route-enter', targetOrigin);
          return;
        }
        replayChatReveal(incoming);
      }

      function ensureRemoteReady(viewName) {
        if(!remoteFrame || remoteFrame.dataset.appView !== viewName || remoteFrame.dataset.ready === 'true') return Promise.resolve();
        if(!remoteFrame.getAttribute('src')) remoteFrame.src = remoteFrame.dataset.src;
        return new Promise((resolve) => {
          const finish = () => resolve();
          remoteFrame.addEventListener('load', finish, {once:true});
          window.setTimeout(finish, 1200);
        });
      }

      async function switchView(viewName, {push = true} = {}) {
        if(viewName === currentView && !switching) return;
        if(switching) {
          pendingSwitch = {viewName, push};
          return;
        }
        switching = true;
        try {
          await ensureRemoteReady(viewName);
          const outgoing = views.find((view) => view.dataset.appView === currentView);
          const incoming = views.find((view) => view.dataset.appView === viewName);
          const sliderDuration = reduceMotion.matches ? 0 : 365;
          const exitDuration = reduceMotion.matches ? 0 : 145;
          const enterDuration = reduceMotion.matches ? 0 : (viewName === 'import' ? 650 : 340);

          outgoing?.classList.remove('switch-in');
          incoming?.classList.remove('switch-out', 'switch-in');
          nav.classList.add('is-shifting');
          updateNavigation(viewName);
          if(sliderDuration) await delay(sliderDuration);
          nav.classList.remove('is-shifting');

          outgoing?.classList.add('switch-out');
          if(exitDuration) await delay(exitDuration);

          prepareViewReveal(viewName, incoming);
          incoming?.classList.add('switch-in');
          outgoing?.classList.remove('switch-out');
          updateView(viewName);
          if(push && location.protocol !== 'file:') history.pushState({view:viewName}, '', viewName === 'chat' ? 'chat.html' : 'import.html');

          if(enterDuration) await delay(enterDuration);
          incoming?.classList.remove('switch-in');
        } finally {
          for(const view of views) view.classList.remove('switch-out');
          nav.classList.remove('is-shifting');
          switching = false;
          const queued = pendingSwitch;
          pendingSwitch = null;
          if(queued && queued.viewName !== currentView) switchView(queued.viewName, {push:queued.push});
        }
      }

      if(remoteFrame) {
        remoteFrame.addEventListener('load', () => { remoteFrame.dataset.ready = 'true'; });
        if(!remoteFrame.getAttribute('src')) remoteFrame.src = remoteFrame.dataset.src;
      }

      nav.addEventListener('click', (event) => {
        const link = event.target.closest('a');
        if(!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        switchView(viewFromLink(link));
      });
      brandLink.addEventListener('click', (event) => {
        if(event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        switchView('chat');
      });
      window.addEventListener('popstate', () => switchView(viewFromPath(), {push:false}));
      const initialView = viewFromPath();
      updateView(initialView);
    })();
  </script>
</body>
</html>
